<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; navigate-to http://127.0.0.1:19090">
    <title data-en="Local Ops Is Offline">Local Ops 暂时离线</title>
    <link rel="stylesheet" href="shell.css">
    <script src="shell-localize.js" defer></script>
  </head>
  <body>
    <main class="shell-card error-card">
      <div class="app-glyph error" aria-hidden="true">!</div>
      <p class="eyebrow">CONTROL PLANE OFFLINE</p>
      <h1 data-en="The Control Plane Is Temporarily Unavailable">后台服务暂时不可用</h1>
      <p class="detail" data-en="The app will retry automatically. You can also choose Restart Control Plane from the menu bar.">App 会自动重试。也可以从菜单栏选择“重启后台控制面”。</p>
      <p id="offline-reason" class="technical-detail" hidden></p>
      <a class="retry-button" href="http://127.0.0.1:19090/" data-en="Try Again">立即重试</a>
    </main>
  </body>
</html>
