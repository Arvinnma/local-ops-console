<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; navigate-to http://127.0.0.1:19090">
    <title>Local Ops 暂时离线</title>
    <link rel="stylesheet" href="shell.css">
  </head>
  <body>
    <main class="shell-card error-card">
      <div class="app-glyph error" aria-hidden="true">!</div>
      <p class="eyebrow">CONTROL PLANE OFFLINE</p>

      <p class="detail">App 会自动重试。也可以从菜单栏选择“重启后台控制面”。</p>
      <a class="retry-button" href="http://127.0.0.1:19090/">立即重试</a>
    </main>
  </body>
</html>
